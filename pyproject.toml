[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-sales-lstm"
version = "0.1.0"

dependencies = [
    "torch",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib", 
    "pyarrow",
    "pyyaml",
    "mlflow",
    "optune",
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]